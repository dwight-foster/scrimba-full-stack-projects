<html>
    <head>
       <link rel="stylesheet" href="index.css">
       <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Smythe&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    </head>
    <body>
        <div id="blur-overlay"></div>
        <section class="header">
            <div class="header-text">
                <h1 id="restaurant-name">Jimmy's Diner</h1>
                <h2 id="restaurant-slogan">The best burgers and pizzas in town.</h2>
            </div>
        </section>
        <main>
            <div class="welcome-message">
                <h1>Welcome To Jimmy's Diner</h1>
            </div>
            <div class="options">
                <form id="login-form" autocomplete="on">
                    <h2>Sign In</h2>
                    <input id="username" class="field-inputs" name="username" type="text" placeholder="USERNAME" autocomplete="username" required>
                    <input id="password" class="field-inputs" name="password" type="password" placeholder="PASSWORD" autocomplete="current-password" required>
                    <button type="submit" class="primary-btn">Sign In</button>
                </form>
                <div class="register-div">
                    <div class="register-message">
                        <h3>Don't have an account yet? Register below.</h3>
                    </div>
                    <a target="_blank" class="link-btn" href="register.html">Register</a>
                </div>
            </div>

        </main>
        <script type="module" src="./js/login.js"></script>
    </body>
</html>
