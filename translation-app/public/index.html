<!doctype html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <div class="site-header">
                <img src="assets/parrot.png" class="header-img"/>
                <div class="header-text">
                    <h1>PollyGlot</h1>
                    <h3>Perfect Translation Every Time</h3>
                </div>
            </div>
        </header>
        <main>
            <div class="translate-div">
                <form id="translate-form">
                    <label id='input-label' class="section-title" for="input-text">Text to translate 👇</label>
                    <textarea id='input-text' name="inputtext" placeholder="How are you?" required></textarea>
                    <div id="form-lower">
                        <label class="section-title">Select language 👇</label>
                        <div class="radio-list">
                            <div class="radio">
                                <input type="radio" id="french" name="language" value="French" required checked>
                                <label for="french">French<img src="assets/fr-flag.png" class="flag"></label><br>
                            </div>

                            <div class="radio">
                                <input type="radio" id="spanish" name="language" value="Spanish">
                                <label for="spanish">Spanish<img src="assets/sp-flag.png" class="flag"></label><br>
                            </div>
                            <div class="radio">
                                <input type="radio" id="japanese" name="language" value="Japanese">
                                <label for="japanese">Japanese<img src="assets/jpn-flag.png" class='flag'></label><br>
                            </div>

                        </div>
                    </div>
                    <div id="results">
                        <div class="results-div">
                            <label class="section-title">Your Translation 👇</label>
                            <div id='output-text'></div>
                        </div>

                    </div>
                    <button type="submit" id='form-btn' class="submit-btn">Translate</button>
                </form>
            </div>
        </main>
        <script src="index.js" type="module"></script>
    </body>
</html>
