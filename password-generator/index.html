<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Karla:ital,wght@0,200..800;1,200..800&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="container">
            <h1 id="title">Generate a</h1>
            <h1 id="title2">random password</h1>
            <h3 id="subtitle">Never use an insecure password again.</h3>
            <div id="length-range">
                <input type="range" id="length" name="length" min="8" max="20" value="15" />
                <label for="length">Password Length:</label>
                <span id="length-value">15</span>
            </div>
            <button id="generate-button" onclick="generatePasswords()">Generate passwords</button>
            <div id="passwords">
                <p id="p1" class="password"></p>
                <p id="p2" class="password"></p>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
