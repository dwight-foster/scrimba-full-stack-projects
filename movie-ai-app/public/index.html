<!doctype html>
<html>
    <head>
        <title>PopChoice</title>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Carter+One&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="page-content">
            <div class="container">
                <div id="header">
                    <img src="images/popcorn.png" class="header-image">
                    <h1 class="header-title" id="title">PopChoice</h1>
                </div>
                <main>
                    <form id="preference-form">
                        <div id="input-section">
                            <textarea class="input-area first-page" name="people" placeholder="How many people?"></textarea>
                            <textarea class="input-area first-page" name="time" placeholder="How much time do you have?"></textarea> 
                            

                        </div>
                        <button type="submit" id="submit-btn">Start</button>
                    </form>
                </main>
            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.11/dist/purify.min.js"></script>
        <script type="module" src="index.js"></script>
    </body>
</html>
