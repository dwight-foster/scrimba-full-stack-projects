<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    </head>
    <body>

        <header class="app-header">
            <img id="logo" src="images/logo.png">
            <img id="profile-pic" src="images/IMG_2449.jpg">
        </header>
        <section class="post">
            <div class="post-header">
                <img class="post-profile" src="images/avatar-vangogh.jpg">
                <div class="post-header-text">
                    <h3 class="post-title">Vincent van Gogh</h3>
                    <p class="location">Zudert, Netherlands</p>
                </div>
            </div>
            <img class="post-img" id="vangogh-post-img" src="images/post-vangogh.jpg">
            <div class="post-footer">
                <div class="icons">
                    <img class="icon" id="vangogh-like-btn" src="images/icon-heart.png">
                    <img class="icon" src="images/icon-comment.png">
                    <img class="icon" src="images/icon-dm.png">
                </div>
                <h3 class='likes' id="vangogh-like-count">21 likes</h3>
                <h3 class="comments"><span class="comment-id">vincey 1853</span> just took a few mushrooms lol</h3>
            </div>
        </section>
        <script src="index.js"></script>
    </body>
</html>
